# ─────────────────────────────────────────────────────────────
#  Конфигурация сервера складского учёта
#  Параметры изменяются БЕЗ перекомпиляции исходного кода
# ─────────────────────────────────────────────────────────────

# Сетевые параметры сервера
server.port=8888
server.thread.pool.size=20

# Параметры подключения к MySQL 8.0
db.url=jdbc:mysql://localhost:3306/warehouse_accounting?useSSL=false&serverTimezone=Europe/Minsk&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
db.username=root
db.password=root

# Параметры модуля прогнозирования
forecast.alpha=0.3
forecast.min.history.days=7
forecast.history.window.days=30
forecast.critical.days=7
forecast.schedule.hour=2

# Параметры сессии (минут до истечения)
session.timeout.minutes=60
